
{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}BLACKCUBE BLOG{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>

<body>

    <!-- Шапка сайта -->
    <header class="header">
        <div class="container header-content">

            <a href="{% url 'home' %}" class="brand">
                <img src="{% static 'blog/images/logo.svg' %}" alt="BlackCube logo">
                <span>BLACKCUBE <b>BLOG</b></span>
            </a>

            <nav>
                <a href="{% url 'home' %}">Главная</a>
                <a href="{% url 'about' %}">О блоге</a>
                <a href="{% url 'reviews' %}">Отзывы</a>
            </nav>

        </div>
    </header>

    <!-- Основное содержимое страницы -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Подвал сайта -->
    <footer class="footer">
        <div class="container">
            <span>BLACKCUBE BLOG</span>
            <p>© 2026 BLACKCUBE. Designed with creativity.</p>
        </div>
    </footer>

</body>
</html>
